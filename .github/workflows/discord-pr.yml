name: discord-pr
on:
  pull_request:
    types: [opened, ready_for_review]

jobs:
  notify:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - name: Ping Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TITLE: ${{ github.event.pull_request.title }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          NUMBER: ${{ github.event.pull_request.number }}
          URL: ${{ github.event.pull_request.html_url }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "DISCORD_WEBHOOK not set, skipping"; exit 0; fi
          jq -n --arg c "@here New PR #$NUMBER by $AUTHOR: $TITLE
          <$URL>" '{content: $c, allowed_mentions: {parse: ["everyone"]}}' \
            | curl -fsS -H 'Content-Type: application/json' -d @- "$WEBHOOK"
